<!--

  fix it in messages.js (on the Mac), then either restart the helper or
  hit http://127.0.0.1:27371/push_messages_now to publish the fix here.
-->
<script src="messages.js"></script>
<body>

<script>
// ════════════════════════════════════════════════════════════════
//  SYNC LAYER
//
//  The phone can NEVER reach the Mac helper: 127.0.0.1 on this
//  device is this device, the helper binds loopback-only, and this
//  page is HTTPS so a plain-HTTP fetch is blocked as mixed content.
//  Everything the phone writes therefore goes to the Gist directly.
//
//  Two files, one writer each, so neither side clobbers the other:
//    mize_schedule.json     written by helper  → read by phone
//    mize_phone_outbox.json written by phone   → drained by helper
//
//  The token is gist-scope-only and lives ONLY in this phone's
//  localStorage — never in the repo, never in this file. Set it
//  under Settings (gear icon).
// ════════════════════════════════════════════════════════════════
const GIST_ID='9fac6be0a44e568a5145853dd9092060';
const GIST_API='https://api.github.com/gists/'+GIST_ID;
const GIST_URL='https://gist.githubusercontent.com/mize77/'+GIST_ID+'/raw/mize_schedule.json';
const SCHEDULE_URL=GIST_URL;
const OUTBOX_FILE='mize_phone_outbox.json';

const LS_TOKEN='mize_gist_token';
const LS_OUTBOX='mize_outbox';
const LS_SCHEDULE='mize_schedule_cache';
const LS_NOTES_LOCAL='mize_notes_local';
const LS_NOTES_REMOTE='mize_notes_remote';

// ── localStorage helpers — never throw (private mode, full disk) ──
function lsGet(k,fallback){try{const v=localStorage.getItem(k);return v?JSON.parse(v):fallback;}catch(e){return fallback;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}}
function getToken(){try{return localStorage.getItem(LS_TOKEN)||'';}catch(e){return'';}}
function setToken(t){try{if(t)localStorage.setItem(LS_TOKEN,t);else localStorage.removeItem(LS_TOKEN);}catch(e){}}
function uid(p){return p+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);}

// ── Toast ────────────────────────────────────────────────────────
let _toastTimer=null;
function showToast(text,actionLabel,actionFn,ms){
  const box=document.getElementById('toast');
  const txt=document.getElementById('toast-text');
  const btn=document.getElementById('toast-action');
  if(!box||!txt||!btn)return;
  txt.textContent=text;
  if(actionLabel&&actionFn){
    btn.style.display='';btn.textContent=actionLabel;
    btn.onclick=()=>{hideToast();actionFn();};
  } else { btn.style.display='none';btn.onclick=null; }
  box.classList.add('show');
  clearTimeout(_toastTimer);
  if(!actionLabel) _toastTimer=setTimeout(hideToast, ms||3000);
}
function hideToast(){const b=document.getElementById('toast');if(b)b.classList.remove('show');}

// ── Gist read/write ──────────────────────────────────────────────
async function gistReadFile(name){
  const tk=getToken();
  if(!tk) throw new Error('No token set');
  const r=await fetch(GIST_API+'?t='+Date.now(),{
    headers:{'Authorization':'token '+tk,'Accept':'application/vnd.github+json'}
  });
  if(r.status===401) throw new Error('Token rejected (401) — check Settings');
  if(!r.ok) throw new Error('Gist read failed ('+r.status+')');
  const g=await r.json();
  const f=g.files&&g.files[name];
  if(!f) return [];
  if(f.truncated&&f.raw_url){
    const rr=await fetch(f.raw_url);
    return JSON.parse((await rr.text())||'[]');
  }
  return JSON.parse(f.content||'[]');
}

async function gistWriteFile(name,obj){
  const tk=getToken();
  if(!tk) throw new Error('No token set');
  const r=await fetch(GIST_API,{
    method:'PATCH',
    headers:{'Authorization':'token '+tk,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
    body:JSON.stringify({files:{[name]:{content:JSON.stringify(obj)}}})
  });
  if(r.status===401) throw new Error('Token rejected (401) — check Settings');
  if(r.status===403) throw new Error('Token lacks gist scope (403)');
  if(!r.ok) throw new Error('Gist write failed ('+r.status+')');
  return true;
}

// ── Outbox: every phone-side write queues here first ─────────────
// Nothing is ever lost: an envelope stays queued until the Gist
// write for it actually succeeds. Union-by-id on both ends makes
// a retry idempotent.
function outbox(){const q=lsGet(LS_OUTBOX,[]);return Array.isArray(q)?q:[];}
function queueOutbox(env){
  const q=outbox();q.push(env);lsSet(LS_OUTBOX,q);
  updatePendingBadge();
  flushOutbox();
}
let _flushing=false;
async function flushOutbox(manual){
  const q=outbox();
  updatePendingBadge();
  if(!q.length){ if(manual) showToast('Nothing waiting to sync'); return true; }
  if(!getToken()){
    if(manual) showToast(q.length+' waiting — add your token','Settings',openSettings);
    return false;
  }
  if(_flushing) return false;
  _flushing=true;
  try{
    const remote=await gistReadFile(OUTBOX_FILE);
    const byId={};
    (Array.isArray(remote)?remote:[]).forEach(e=>{if(e&&e.id)byId[e.id]=e;});
    q.forEach(e=>{byId[e.id]=e;});
    const merged=Object.keys(byId).map(k=>byId[k]).sort((a,b)=>(a.ts||0)-(b.ts||0));
    await gistWriteFile(OUTBOX_FILE,merged);
    // Re-read the queue — something may have been added mid-flight.
    const sent={};q.forEach(e=>{sent[e.id]=1;});
    lsSet(LS_OUTBOX, outbox().filter(e=>!sent[e.id]));
    updatePendingBadge();
    if(manual) showToast('✓ Synced — GSM picks it up within a minute');
    return true;
  }catch(err){
    if(manual) showToast('Sync failed: '+err.message,'Settings',openSettings);
    return false;
  }finally{ _flushing=false; }
}
function updatePendingBadge(){
  const el=document.getElementById('pending-badge');
  if(!el)return;
  const n=outbox().length;
  if(n){el.style.display='';el.textContent=n+' pending';}
  else el.style.display='none';
}

// ── Notes: read from the schedule Gist (public, no token needed) ──
async function fetchNotesFromGist(){
  try{
    const r=await fetch(SCHEDULE_URL+'?t='+Date.now());
    const d=await r.json();
    const notes=d.notes||[];
    lsSet(LS_NOTES_REMOTE,notes);
    return notes;
  }catch(e){return null;}
}

// Merge what GSM has with what this phone did. Local wins when it is
// newer; locally deleted notes are tombstoned so a refetch can't
// resurrect them before the helper has drained the delete.
function mergeNotes(remote,local){
  const byId={};
  (remote||[]).forEach(n=>{if(n&&n.id)byId[n.id]=n;});
  (local||[]).forEach(n=>{
    if(!n||!n.id)return;
    const r=byId[n.id];
    byId[n.id]= r ? ((n.ts||0)>=(r.ts||0) ? Object.assign({},r,n) : r) : n;
  });
  return Object.keys(byId).map(k=>byId[k])
    .filter(n=>!n._deleted)
    .sort((a,b)=>(b.ts||0)-(a.ts||0));
}

function localNotes(){const n=lsGet(LS_NOTES_LOCAL,[]);return Array.isArray(n)?n:[];}
function upsertLocalNote(note){
  const list=localNotes();
  const i=list.findIndex(n=>n.id===note.id);
  if(i>=0) list[i]=Object.assign({},list[i],note); else list.unshift(note);
  // Prune tombstones older than 30 days so this can't grow forever.
  const cutoff=Date.now()-30*24*60*60*1000;
  lsSet(LS_NOTES_LOCAL, list.filter(n=>!(n._deleted&&(n.ts||0)<cutoff)));
}



function noteTs(ts){
  const d=new Date(ts);
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
}

async function loadNotesTab(){
  // Paint from local state first so the tab is never blank and a note
  // you just wrote is visible instantly, offline included.
  phoneNotes=mergeNotes(lsGet(LS_NOTES_REMOTE,[]),localNotes());
  renderNotes();
  const fetched=await fetchNotesFromGist();
  if(fetched===null){
    const msg=document.getElementById('notes-sync-msg');
    if(msg){msg.textContent='⚠ Offline — showing notes stored on this phone';}
    return;
  }
  phoneNotes=mergeNotes(fetched,localNotes());
  renderNotes();
}

function renderNotes(){
  // Preserve whatever is half-typed in the box across a re-render.
  let draft='';
  try{const ta=document.getElementById('note-input');if(ta)draft=ta.value;}catch(e){}
  let html='<div class="notes-sync-row">'
    +'<button class="sync-btn" onclick="loadNotesTab()">↻ Refresh</button>'
    +'<span class="sync-msg" id="notes-sync-msg"></span>'
    +'</div>'
    +'<div class="note-input-row">'
    +'<textarea class="note-textarea" id="note-input" placeholder="Write a note to sync with GSM..." rows="3"></textarea>'
    +'<button class="note-add-btn" onclick="addPhoneNote()">+ Add Note</button>'
    +'</div>';
  if(!phoneNotes.length){
    html+='<div class="empty">No notes yet. Write one above — it will sync to GSM.</div>';
  } else {
    phoneNotes.forEach((n,i)=>{
      const isDone = !!n.done;
      html+=`<div class="note-card" id="note-${n.id}" style="${isDone?'opacity:0.5;':''}">
        <div class="note-text">${escHtml(n.text||'')}</div>
        <div class="note-meta">${n.source==='gsm'?'From GSM · ':''}${noteTs(n.ts)}${isDone?' · Pending GSM sync':''}</div>
        <div class="note-btns">
          ${!isDone?`<button class="nbtn done-btn" onclick="markNoteDone('${n.id}')">✓ Done</button>`:''}
          <button class="nbtn del-btn" onclick="deletePhoneNote('${n.id}')">🗑</button>
        </div>
      </div>`;
    });
  }
  document.getElementById('content').innerHTML=html;
  try{const ta=document.getElementById('note-input');if(ta&&draft)ta.value=draft;}catch(e){}
  updatePendingBadge();
}

// Every note operation: write locally (survives a reload immediately),
// then queue an envelope for the helper to drain into gsm_data.json.
function noteSyncMsg(text,ms){
  const msg=document.getElementById('notes-sync-msg');
  if(msg){msg.textContent=text;setTimeout(()=>{if(msg&&msg.textContent===text)msg.textContent='';},ms||2500);}
}

async function addPhoneNote(){
  const ta=document.getElementById('note-input');
  const text=(ta&&ta.value||'').trim();
  if(!text)return;
  const note={id:'phone_'+Date.now(),text:text,ts:Date.now(),source:'phone',done:false};
  if(ta)ta.value='';
  upsertLocalNote(note);
  phoneNotes=mergeNotes(lsGet(LS_NOTES_REMOTE,[]),localNotes());
  renderNotes();
  queueOutbox({id:uid('ob'),type:'note',op:'add',ts:Date.now(),note:note});
  noteSyncMsg(getToken()?'✓ Saved — syncing to GSM':'✓ Saved on this phone — add a token in ⚙ to sync');
}

async function markNoteDone(id){
  const existing=(phoneNotes.find(n=>n.id===id))||{id:id};
  const upd=Object.assign({},existing,{done:true,ts:Date.now()});
  upsertLocalNote(upd);
  phoneNotes=mergeNotes(lsGet(LS_NOTES_REMOTE,[]),localNotes());
  renderNotes();
  queueOutbox({id:uid('ob'),type:'note',op:'done',ts:Date.now(),note:{id:id,done:true}});
  noteSyncMsg('✓ Marked done — syncing to GSM');
}

async function deletePhoneNote(id){
  upsertLocalNote({id:id,_deleted:true,ts:Date.now()});
  phoneNotes=mergeNotes(lsGet(LS_NOTES_REMOTE,[]),localNotes());
  renderNotes();
  queueOutbox({id:uid('ob'),type:'note',op:'delete',ts:Date.now(),note:{id:id}});
}

function sdk(s){if(!s)return'';const d=(typeof s==='string'&&s.length===10)?new Date(s+'T00:00:00'):new Date(s);return ldk(d)}
function ft(t){if(!t)return'';try{const[h,m]=t.split(':').map(Number);return(h%12||12)+':'+(String(m).padStart(2,'0'))+(h>=12?' PM':' AM');}catch{return t}}
function fdl(s){const d=(typeof s==='string'&&s.length===10)?new Date(s+'T00:00:00'):new Date(s);return d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})}
function fds(s){const d=(typeof s==='string'&&s.length===10)?new Date(s+'T00:00:00'):new Date(s);return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}

// Get athlete display name — nickname first, then first name only
function athName(a){
  if(!a) return '';
  if(a.nickname && a.nickname.trim()) return a.nickname.trim();
  if(a.name) return a.name.split(' ')[0];
  return (a.firstname||'').trim();
}
function parentName(a){

}

// Render without losing the user's place in a long list.
function renderPreservingScroll(){
  const y=window.scrollY;
  render();
  try{window.scrollTo(0,y);}catch(e){}
}

// Paint from the cached copy before the network is even tried, so the
// app opens instantly and works with no signal at all.
function bootFromCache(){
  const c=lsGet(LS_SCHEDULE,null);
  if(!c||!c.json)return false;
  try{ data=JSON.parse(c.json); stampUpdated(true); render(); return true; }
  catch(e){ return false; }
}

async function loadData(opts){
  opts=opts||{};
  try{
    const r=await fetch(GIST_URL+'?t='+Date.now());
    const text=await r.text();
    if(!text||text.trim()==='{}'){
      if(!data) document.getElementById('content').innerHTML='<div class="empty">Schedule data is empty. Open GSM and save any change to push schedule.</div>';
      return;
    }
    data=JSON.parse(text);
    lsSet(LS_SCHEDULE,{json:text,cachedAt:Date.now()});
    stampUpdated(false);
    // A background refresh must never wipe the Notes tab or a
    // half-typed note out from under you.
    if(opts.silent) return;
    renderPreservingScroll();
  }catch(e){
    if(bootFromCache()) return;
    if(!data) document.getElementById('content').innerHTML='<div class="empty">Could not load. Check connection and refresh.<br><small>'+escHtml(e.message||String(e))+'</small></div>';
  }
}

function days7(){const now=new Date(),days=[];for(let i=0;i<7;i++){const d=new Date(now);d.setDate(now.getDate()+i);days.push(d);}return days;}
function days3(){const now=new Date(),days=[];for(let i=0;i<3;i++){const d=new Date(now);d.setDate(now.getDate()+i);days.push(d);}return days;}

function getEvs(dk){
  const evs=[];
  const athletes=data.athletes||[],coaches=data.coaches||[];
  (data.programs||[]).forEach(prog=>{
    (prog.dates||[]).forEach(d=>{
      if(sdk(d.date)!==dk)return;
      const lc=coaches.find(c=>c.id===(d.leadCoachId||'mize_master_001'))||coaches.find(c=>c.isDefault)||coaches[0];
      evs.push({kind:'group',id:d.id,name:prog.name,level:prog.level,startTime:d.startTime||prog.startTime||'',endTime:d.endTime||prog.endTime||'',location:d.location||prog.location||'',address:d.address||prog.address||'',date:d.date,count:(d.attendees||[]).length,prog,occ:d,lc,isRemote:false});
    });
  });
  (data.privateSessions||[]).forEach(s=>{
    if(sdk(s.date)!==dk)return;
    const a1=athletes.find(a=>a.id===s.athleteId),a2=s.athlete2Id?athletes.find(a=>a.id===s.athlete2Id):null;
    const nm=[athName(a1),athName(a2)].filter(Boolean).join(' + ');
    const lc=coaches.find(c=>c.id===(s.leadCoachId||'mize_master_001'))||coaches.find(c=>c.isDefault)||coaches[0];
    evs.push({kind:'private',id:s.id,name:nm||'Private Session',type:s.type||'Private Session',startTime:s.time||'',endTime:s.endTime||'',location:s.poolName||'',address:s.poolAddress||'',date:s.date,session:s,lc,isRemote:(s.poolName||'').toLowerCase().includes('zoom')||(s.type||'').toLowerCase().includes('remote')});
  });
  (data.meetings||[]).forEach(m=>{
    if(m.date!==dk)return;
    const a=athletes.find(x=>x.id===m.athleteId);
    const tl=m.meetingType==='Other'?m.otherType:m.meetingType;
    const lc=coaches.find(c=>c.id===(m.leadCoachId||'mize_master_001'))||coaches.find(c=>c.isDefault)||coaches[0];
    evs.push({kind:'meeting',id:m.id,name:(athName(a)||'Meeting')+' — '+tl,startTime:m.time||'',location:m.location||'',date:m.date,meeting:m,lc,isRemote:m.meetingType==='Zoom Meeting'});
  });
  return evs.sort((a,b)=>(a.startTime||'99:99').localeCompare(b.startTime||'99:99'));
}

// All message text comes from MIZE_MESSAGES (messages.js, loaded above) —
// the same logic GSM uses. This file only maps this app's simpler event/
// athlete shape onto messages.js's function signatures. Never add fee,
// pool, or package wording directly here — fix it in messages.js instead,
// then push it to GitHub Pages (helper does this automatically on restart,
// or hit /push_messages_now manually).
function buildConfirm(ev){
  if(typeof MIZE_MESSAGES === 'undefined') {
    return 'Could not load message templates (messages.js). Check your connection and tap Refresh, then try again.';
  }
  const athletes=data.athletes||[];
  const pools=data.pools||[];
  if(ev.kind==='group'){
    const occ=ev.occ,prog=ev.prog;
    const attending=(occ.attendees||[]).map(id=>athletes.find(a=>a.id===id)).filter(Boolean);
    if(!attending.length)return'No athletes registered yet.';
    // Return array of {athlete, message} for the picker
    return attending.map(a=>{
      const isPaid=(occ.paidAttendees||[]).includes(a.id)||(occ.pkgAttendees||[]).includes(a.id)||(occ.freeAttendees||[]).includes(a.id)||!!a.hasFreePackage;
      return {
        athlete: a,
        message: MIZE_MESSAGES.groupConfirm(
          prog, occ, a.name, a.parentName, isPaid,
          a.parentNickname||'', a.nickname||'',
          a.messageToParent!==false, a.messageToAthlete===true,
          a.region, a.state, false, pools, a.poolId
        )
      };
    });
  }
  if(ev.kind==='private'){
    const s=ev.session;
    const a=athletes.find(x=>x.id===s.athleteId);
    return MIZE_MESSAGES.privateConfirm(
      s, a?.name, a?.parentName, true,
      a?.parentNickname||'', a?.nickname||'',
      a?.messageToParent!==false, a?.messageToAthlete===true,
      a?.region, a?.state, false, pools, a?.poolId
    );
  }
  if(ev.kind==='meeting'){
    const m=ev.meeting,a=athletes.find(x=>x.id===m.athleteId);
    return MIZE_MESSAGES.meetingConfirm(
      m, a?.name, a?.parentName,
      a?.parentNickname||'', a?.region, a?.state
    );
  }
  return'';
}

function showConfirm(ev) {
  if(!data){loadData().then(()=>showConfirm(ev));return;}
  if(typeof MIZE_MESSAGES==='undefined'){showMsg('Error','Message templates not loaded. Tap Refresh.');return;}

  // Group session — show athlete picker
  if(ev.kind==='group'){
    const result = buildConfirm(ev);
    if(typeof result === 'string'){showMsg('Athlete Confirmation', result);return;}
    if(!result.length){showMsg('Athlete Confirmation','No athletes registered yet.');return;}
    showAthletePicker('Athlete Confirmation', result);
    return;
  }
  // Private/meeting — show message directly
  showMsg('Athlete Confirmation', buildConfirm(ev));
}

function showInvite(ev) {
  if(typeof MIZE_MESSAGES === 'undefined') {
    showMsg('Error', 'Message templates not loaded. Tap Refresh and try again.');
    return;
  }
  if(ev.kind !== 'group') { showMsg('Athlete Invitation', buildConfirm(ev)); return; }

  const athletes = data.athletes || [];
  const pools = data.pools || [];
  const prog = ev.prog, occ = ev.occ;
  const attending = new Set(occ.attendees || []);

  // Find pool and its region priorities
  const location = occ.location || prog.location || '';
  const pool = pools.find(p => p.name && location && p.name.toLowerCase() === location.toLowerCase());
  const poolRegions = pool?.regions || (pool?.region ? [pool.region] : []);

  // Region score: primary=0, secondary=1, tertiary=2, no match=99
  function regionScore(a) {
    if(!a.region) return 99;
    const idx = poolRegions.indexOf(a.region);
    return idx >= 0 ? idx : 99;
  }

  const LRANK = {'Elite':5,'High Performance':4,'Advanced':3,'Intermediate':2,'Beginner':1};
  function levelScore(a) { return LRANK[a.level] || 0; }

  const eligible = athletes
    .filter(a => a.invited !== false && !attending.has(a.id) && a.name)
    .sort((a,b) => {
      const rd = regionScore(a) - regionScore(b);
      if(rd !== 0) return rd;
      const ld = levelScore(b) - levelScore(a);
      if(ld !== 0) return ld;
      return (a.name.split(' ')[0]).localeCompare(b.name.split(' ')[0]);
    });

  if(!eligible.length) { showMsg('Athlete Invitation', 'All eligible athletes are already registered.'); return; }

  const regionLabels = ['Primary Region','Secondary Region','Tertiary Region'];
  let html = '<div style="margin-bottom:12px;font-size:11px;color:#555;text-transform:uppercase;letter-spacing:0.06em">Select athlete to invite</div>';
  let lastScore = -1;
  eligible.forEach((a, i) => {
    const rs = regionScore(a);
    if(rs !== lastScore) {
      const label = rs < 3 ? (poolRegions[rs] + (rs===0?' · Primary':rs===1?' · Secondary':' · Tertiary'))
        : (rs === 99 ? 'Other Regions' : 'Other');
      html += '<div style="font-size:10px;font-weight:700;color:#444;text-transform:uppercase;letter-spacing:0.06em;margin:10px 0 5px">' + label + '</div>';
      lastScore = rs;
    }
    const sub = [a.level, a.region].filter(Boolean).join(' · ');
    html += '<button data-invite-idx="' + i + '" style="width:100%;text-align:left;padding:9px 11px;'
      + 'border-radius:9px;border:1px solid #2a2f3a;background:#1a1f27;margin-bottom:5px;cursor:pointer">'

function buildBriefing(coach){
  const now=new Date();
  const DAY=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const greeting = coach
    ? 'Hi ' + (coach.nickname||coach.firstname||'Coach') + ', here is the schedule for the next 3 days:'
    : 'MIZE Coaching - Next 3 Days';
  let lines=[greeting,''];
  days3().forEach((day,i)=>{
    const dk=ldk(day);
    const dayLbl=i===0?'Today':i===1?'Tomorrow':DAY[day.getDay()];
    const dateLbl=MON[day.getMonth()]+' '+day.getDate();
    const evs=getEvs(dk);
    lines.push('— '+dayLbl+', '+dateLbl+' —');
    if(!evs.length){lines.push('No sessions');lines.push('');}
    else{
      evs.forEach(ev=>{
        const ts=ev.startTime?ft(ev.startTime)+(ev.endTime?' - '+ft(ev.endTime):''):'';
        const loc=ev.location||'';
        // Mark sessions the coach is leading
        const isLead = coach && ev.lc && (ev.lc.id === coach.id);
        const marker = isLead ? '★ ' : '  ';
        lines.push(marker+[ts,ev.name,loc].filter(Boolean).join('  '));
      });
      lines.push('');
    }
  });
  lines.push('Best greetings, MIZE');
  return lines.join('\n');
}

async function markPaidToggle(btn) {
  const idx    = parseInt(btn.dataset.idx);
  const ev     = window._evs[idx];
  if(!ev) return;
  const nowPaid = btn.dataset.paid === '1';
  const newPaid = !nowPaid;

  // Optimistic UI update
  btn.textContent  = newPaid ? '✓ Paid' : 'Mark Paid';
  btn.className    = 'paid-toggle ' + (newPaid ? 'paid' : 'unpaid');
  btn.dataset.paid = newPaid ? '1' : '0';

  // Update local data immediately so re-renders stay consistent
  if(ev.kind === 'group') {
    const occ = ev.occ;
    if(!occ.paidAttendees) occ.paidAttendees = [];
    if(newPaid) { if(!occ.paidAttendees.includes(btn.dataset.aid)) occ.paidAttendees.push(btn.dataset.aid); }
    else occ.paidAttendees = occ.paidAttendees.filter(id => id !== btn.dataset.aid);
  } else if(ev.kind === 'private') {
    const ath = parseInt(btn.dataset.ath);
    if(ath===1) ev.session.paid  = newPaid;
    if(ath===2) ev.session.paid2 = newPaid;
  }

  // Local override keeps the button green across re-renders until the
  // Mac has actually applied it; the outbox is what gets it there.
  const payload = ev.kind === 'group'
    ? { kind:'group', progId:ev.prog.id, occId:ev.occ.id, athleteId:btn.dataset.aid, paid:newPaid }
    : { kind:'private', sessionId:ev.session.id, athlete:parseInt(btn.dataset.ath), paid:newPaid };
  try {
    const store = JSON.parse(localStorage.getItem('mize_paid_overrides')||'{}');
    const key = ev.kind === 'group'
      ? ev.occ.id + '_' + btn.dataset.aid
      : ev.session.id + '_' + parseInt(btn.dataset.ath);
    store[key] = Object.assign({}, payload, { ts: Date.now() });
    localStorage.setItem('mize_paid_overrides', JSON.stringify(store));
  } catch(err) { /* private mode — the outbox below is the real record */ }

  queueOutbox({ id: uid('ob'), type:'paid', ts: Date.now(), payload: payload });
}

// window.open is unreliable from an installed iOS PWA and maps:// is
// not a real scheme — https://maps.apple.com hands off to the Maps app
// on iOS and still works everywhere else.
function openMaps(address) {
  if(!address) { showToast('No address on file'); return; }
  window.location.href = 'https://maps.apple.com/?q=' + encodeURIComponent(address);
}

// One place that builds an sms: link. iOS wants `sms:<numbers>&body=`,
// never `sms://`, and navigation must be a location change.
function openSms(phones, body) {
  const list = (Array.isArray(phones) ? phones : [phones])
    .map(p => String(p||'').replace(/[^0-9+]/g,'')).filter(Boolean).join(';');
  if(!list) { showToast('No phone number on file'); return; }
  window.location.href = 'sms:' + list + (body ? '&body=' + encodeURIComponent(body) : '');
}

// Clipboard API needs a secure context (we have one) but can still be
// refused; execCommand is the fallback that works everywhere.
function copyText(text) {
  try {
    if(navigator.clipboard && navigator.clipboard.writeText)
      return navigator.clipboard.writeText(text).catch(()=>legacyCopy(text));
  } catch(e) {}
  legacyCopy(text);
  return Promise.resolve();
}
function legacyCopy(text) {
  const el = document.createElement('textarea');
  el.value = text; el.setAttribute('readonly','');
  el.style.position='fixed'; el.style.opacity='0';
  document.body.appendChild(el); el.select(); el.setSelectionRange(0, text.length);
  try { document.execCommand('copy'); } catch(e) {}
  document.body.removeChild(el);
}

function openMessages(ev) {
  const athletes = data.athletes || [];
  let phones = [];
  let msg = buildConfirm(ev);

  if(ev.kind === 'group') {
    const occ = ev.occ;
    const attending = (occ.attendees || []).map(id => athletes.find(a => a.id === id)).filter(Boolean);
    attending.forEach(a => {
      if(a.messageToParent !== false && a.parentPhone) phones.push(a.parentPhone.replace(/\D/g,''));
      if(a.messageToAthlete === true && a.phone) phones.push(a.phone.replace(/\D/g,''));
    });
  } else if(ev.kind === 'private') {
    const s = ev.session;
    const a = athletes.find(x => x.id === s.athleteId);
    if(a) {
      if(a.messageToParent !== false && a.parentPhone) phones.push(a.parentPhone.replace(/\D/g,''));
      if(a.messageToAthlete === true && a.phone) phones.push(a.phone.replace(/\D/g,''));
    }
    const a2 = s.athlete2Id ? athletes.find(x => x.id === s.athlete2Id) : null;
    if(a2) {
      if(a2.messageToParent !== false && a2.parentPhone) phones.push(a2.parentPhone.replace(/\D/g,''));
      if(a2.messageToAthlete === true && a2.phone) phones.push(a2.phone.replace(/\D/g,''));
    }
  } else if(ev.kind === 'meeting') {
    const m = ev.meeting;
    const a = athletes.find(x => x.id === m.athleteId);
    if(a && a.parentPhone) phones.push(a.parentPhone.replace(/\D/g,''));
  }

  if(!phones.length) {
    showToast('No phone number on file — add one in Athlete Manager', null, null, 4000);
    return;
  }

  copyText(msg||'');
  openSms(phones, msg);
}

}

function isPaidForAthlete(ev, athleteId) {
  // Check localStorage overrides first (phone-side paid toggles not yet synced to GSM)
  try {
    const store = JSON.parse(localStorage.getItem('mize_paid_overrides')||'{}');
    if(ev.kind === 'group') {
      const key = ev.occ.id + '_' + athleteId;
      if(store[key]) return store[key].paid;
    }
  } catch(e) {}
  if(ev.kind === 'group') {
    const occ = ev.occ;
    return (occ.paidAttendees||[]).includes(athleteId) || (occ.pkgAttendees||[]).includes(athleteId) || (occ.freeAttendees||[]).includes(athleteId);
  }
  if(ev.kind === 'private') {
    const s = ev.session;
    const ath = (s.athleteId === athleteId) ? 1 : (s.athlete2Id === athleteId ? 2 : 0);
    if(ath) {
      try {
        const store = JSON.parse(localStorage.getItem('mize_paid_overrides')||'{}');
        const o = store[s.id + '_' + ath];
        if(o) return o.paid;
      } catch(e) {}
      return ath === 1 ? !!s.paid : !!s.paid2;
    }
  }
  return false;
}

// ── Matrix grid geometry ─────────────────────────────────────────
// These three were referenced by renderMatrix() but never declared
// anywhere in this file, so the Schedule tab threw
// "ReferenceError: SLOTS is not defined" on its first loop and never
// wrote any HTML. SH must stay in sync with .m-slot / .m-tslot height.
const SH = 28;                 // px per half-hour row (CSS: .m-slot{height:28px})
const GRID_MIN_HOUR = 7;       // grid always covers at least 7am…
const GRID_MAX_HOUR = 21;      // …through 9pm
let HS = GRID_MIN_HOUR;        // first hour shown
let HE = GRID_MAX_HOUR;        // last hour shown (exclusive)
let SLOTS = (HE - HS) * 2;

// Widen the window if anything in the visible week falls outside it,
// so an early-morning or late-evening session is never clipped away.
function calcGridRange(){
  let lo = GRID_MIN_HOUR, hi = GRID_MAX_HOUR;
  try{
    days7().forEach(day => {
      getEvs(ldk(day)).forEach(ev => {
        const s = parseInt(String(ev.startTime||'').split(':')[0], 10);
        const e = parseInt(String(ev.endTime||ev.startTime||'').split(':')[0], 10);
        if(!isNaN(s)) lo = Math.min(lo, s);
        if(!isNaN(e)) hi = Math.max(hi, e + 1);
      });
    });
  }catch(err){ /* fall back to the default window */ }
  HS = Math.max(0, Math.min(lo, GRID_MIN_HOUR));
  HE = Math.min(24, Math.max(hi, GRID_MAX_HOUR));
  SLOTS = Math.max(2, (HE - HS) * 2);
}

function tts(t){if(!t)return null;const[h,m]=t.split(':').map(Number);return(h-HS)*2+(m>=30?1:0);}
function ds(s,e){if(!s||!e)return 2;const[sh,sm]=s.split(':').map(Number),[eh,em]=e.split(':').map(Number);return Math.max(1,Math.round(((eh*60+em)-(sh*60+sm))/30));}

function renderMatrix(){
  if(!data){document.getElementById('content').innerHTML='<div class="empty">Loading schedule…</div>';return;}
  calcGridRange();
  const now=new Date(),todayKey=ldk(now);
  const DS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const MS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const CC={group:'#00d4aa',private:'#a78bfa',meeting:'#e879a0'};
  let all=[],html='<div class="matrix-wrap"><div class="matrix-grid">';
  html+='<div class="m-times">';
  for(let i=0;i<SLOTS;i++){const h=HS+Math.floor(i/2),ih=i%2===0;const h12=h>12?h-12:(h===0?12:h),ap=h>=12?'PM':'AM';html+=`<div class="m-tslot">${ih?`<span class="m-tlabel">${h12}${ap}</span>`:''}</div>`;}
  html+='</div>';
  days7().forEach((day,ci)=>{
    const dk=ldk(day),isT=dk===todayKey,evs=getEvs(dk);
    const ei=all.length;evs.forEach(e=>all.push(e));
    html+=`<div class="m-col"><div class="m-col-hdr"><div class="m-col-day">${isT?'TODAY':DS[day.getDay()]}</div><div class="m-col-date ${isT?'today':''}">${MS[day.getMonth()]} ${day.getDate()}</div></div><div style="position:relative">`;
    for(let i=0;i<SLOTS;i++)html+=`<div class="m-slot${i%2!==0?' half':''}"></div>`;
    if(isT){const ns=(now.getHours()-HS)*2+(now.getMinutes()>=30?1:0);if(ns>=0&&ns<SLOTS){const top=ns*SH+(now.getMinutes()%30/30)*SH;html+=`<div class="now-line" style="top:${top}px"></div>`;}}
    evs.forEach((ev,i)=>{
      const sl=tts(ev.startTime);if(sl===null||sl<0||sl>=SLOTS)return;
      const dur=ev.endTime?ds(ev.startTime,ev.endTime):2;
      const top=sl*SH+1,h=Math.max(SH,dur*SH)-2,c=CC[ev.kind]||'#888',gi=ei+i;
      html+=`<div class="m-ev" style="top:${top}px;height:${h}px;background:${c}22;border-left:3px solid ${c}" onclick="showEvDetail(${gi})"><div class="m-ev-name" style="color:${c}">${escHtml(ev.name||'')}</div>${ev.startTime?`<div class="m-ev-time" style="color:${c}">${ft(ev.startTime)}</div>`:''}</div>`;
    });
    html+='</div></div>';
  });
  html+='</div></div>';
  document.getElementById('content').innerHTML=html;
  window._evs=all;
}

function showEvDetail(idx){
  const ev=window._evs[idx];if(!ev)return;
  showConfirm(ev);
}

// ════════════════════════════════════════════════════════════════
//  SETTINGS
// ════════════════════════════════════════════════════════════════
function openSettings(){
  renderSettings();
  document.getElementById('settings-modal').style.display='flex';
}
function closeSettings(){
  document.getElementById('settings-modal').style.display='none';
}

function renderSettings(status){
  const tk=getToken();
  const pending=outbox().length;
  const masked=tk ? tk.slice(0,4)+'…'+tk.slice(-4)+' ('+tk.length+' chars)' : 'not set';
  document.getElementById('settings-body').innerHTML=
     '<div class="set-label">GitHub token (gist scope)</div>'
    +'<input class="set-input" id="tok-input" type="password" autocomplete="off" '
    +'autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="ghp_… or github_pat_…"/>'
    +'<div class="set-row">'
    +'<button class="set-btn" onclick="saveTokenFromInput()">Save</button>'
    +'<button class="set-btn ghost" onclick="testToken()">Test</button>'
    +(tk?'<button class="set-btn danger" onclick="clearToken()">Clear</button>':'')
    +'</div>'
    +'<div class="set-status" id="tok-status">'
    +(status||('Current: <span class="'+(tk?'set-ok':'set-bad')+'">'+escHtml(masked)+'</span>'))
    +'</div>'
    +'<div class="set-hint">Create it at github.com → Settings → Developer settings → '
    +'Personal access tokens. It needs the <b>gist</b> scope and nothing else. '
    +'It is stored only on this phone — never in the app or the repo.</div>'

    +'<div class="set-label">Pending writes</div>'
    +'<div class="set-status">'+(pending
        ? '<span class="set-bad">'+pending+' waiting to reach GSM</span>'
        : '<span class="set-ok">Everything synced</span>')+'</div>'
    +'<div class="set-row">'
    +'<button class="set-btn" onclick="flushOutbox(true).then(()=>renderSettings())">Sync now</button>'
    +'</div>'

    +'<div class="set-label">App</div>'
    +'<div class="set-status">Build '+escHtml(APP_BUILD)+'</div>'
    +'<div class="set-row">'
    +'<button class="set-btn ghost" onclick="forceUpdate()">Force update</button>'
    +'</div>'
    +'<div class="set-hint">Force update clears the offline cache and reloads. '
    +'Pending writes and your token are kept.</div>';
}

function saveTokenFromInput(){
  const el=document.getElementById('tok-input');
  const v=(el&&el.value||'').trim();
  if(!v){ renderSettings('<span class="set-bad">Paste a token first.</span>'); return; }
  setToken(v);
  renderSettings('<span class="set-ok">✓ Saved. Tap Test to verify.</span>');
  flushOutbox();
}

function clearToken(){
  setToken('');
  renderSettings('<span class="set-bad">Token cleared. Notes still save on this phone.</span>');
}

async function testToken(){
  const st=document.getElementById('tok-status');
  if(st) st.innerHTML='Testing…';
  try{
    const tk=getToken();
    if(!tk) throw new Error('No token set');
    const r=await fetch(GIST_API,{headers:{'Authorization':'token '+tk,'Accept':'application/vnd.github+json'}});
    if(r.status===401) throw new Error('Rejected (401) — wrong or expired token');
    if(r.status===404) throw new Error('Gist not found (404) — token lacks gist scope');
    if(!r.ok) throw new Error('HTTP '+r.status);
    const g=await r.json();
    const owner=(g.owner&&g.owner.login)||'unknown';
    renderSettings('<span class="set-ok">✓ Working — signed in as '+escHtml(owner)+'</span>');
  }catch(err){
    renderSettings('<span class="set-bad">✗ '+escHtml(err.message||String(err))+'</span>');
  }
}

async function forceUpdate(){
  try{
    if(window.caches){ const keys=await caches.keys(); await Promise.all(keys.map(k=>caches.delete(k))); }
    if(navigator.serviceWorker){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
  }catch(e){}
  location.href=location.pathname+'?v='+Date.now();
}

// ════════════════════════════════════════════════════════════════
//  SERVICE WORKER
// ════════════════════════════════════════════════════════════════
const APP_BUILD='2026-08-27b';

function registerSW(){
  if(!('serviceWorker' in navigator))return;
  navigator.serviceWorker.register('sw.js',{scope:'./'}).then(reg=>{
    reg.addEventListener('updatefound',()=>{
      const nw=reg.installing;
      if(!nw)return;
      nw.addEventListener('statechange',()=>{
        // A controller already exists → this is an update, not a first install.
        if(nw.state==='installed'&&navigator.serviceWorker.controller){
          showToast('New version available','Reload',()=>nw.postMessage('SKIP_WAITING'));
        }
      });
    });
  }).catch(()=>{});
  let reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(reloading)return; reloading=true; location.reload();
  });
}

// ════════════════════════════════════════════════════════════════
//  BOOTSTRAP
// ════════════════════════════════════════════════════════════════
(function boot(){
  // ?reset=1 is the escape hatch if a bad build ever gets cached.
  if(/[?&]reset=1/.test(location.search)){ forceUpdate(); return; }

  registerSW();
  updatePendingBadge();
  bootFromCache();     // instant paint from the last good copy
  loadData();          // then refresh from the network
  flushOutbox();       // and push anything that was queued offline

  // Background schedule refresh. `silent` while the Notes tab is open
  // so it can never wipe a note you are in the middle of writing.
  setInterval(()=>loadData({silent: tab==='notes'}), 5*60*1000);

  // Retry queued writes; also the moment connectivity comes back.
  setInterval(()=>flushOutbox(), 60*1000);
  window.addEventListener('online', ()=>flushOutbox());
  document.addEventListener('visibilitychange', ()=>{
    if(!document.hidden){ flushOutbox(); loadData({silent: tab==='notes'}); }
  });
})();
</script>
